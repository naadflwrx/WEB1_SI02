<!DOCTYPE html>
<html lang="en">
<head>
    <title>Latihan Form</title>
</head>
<body>
    <h2>FORMULIR</h2>
    <br>
    <form>
    <label>Masukkan Nama Anda:</label>
    <input type="text" name="nama" value="">
    <br><br> 
    
    <label>Masukkan Password:</label>
    <input type="password" name="sandi" value="">
    <br><br>  

    <label>Masukan Alamat Email:</label>
    <input type="email" name="emailku" placeholder="user@gmail.com">
    <br><br>  

    <label> Masukan Warna Favorit:</label>
    <input type="color" name="favcolor">
    <br><br>  

    <label>Masukkan Tanggal Lahir:</label>
    <input type="date" name="tgllahir">
    <br><br>

    <label>Nilai Ujian</label>
    <input type="number" name="nilai" min="0" max="10">
    <br><br>  

    <label>Pilih Minggu:</label>
    <input type="week" name="minggu">
    <br><br>

    <label>Pilih Bulan:</label>
    <input type="month" name="januari">
    <br><br>

    <label>Upload Foto:</label>
    <input type="file" name="foto">
    <br><br>

    <label>Pilih Menu:</label><br>
    <input type="checkbox" name="menu" value="menu1">Menu Pertama<br>
    <input type="checkbox" name="menu" value="menu2">Menu Kedua<br>
    <input type="checkbox" name="menu" value="menu3">Menu Ketiga
    <br><br>

    <label>Jenis Kelamin:</label><br>
    <input type="radio" name="jk" value="L">Laki-laki<br>
    <input type="radio" name="jk" value="P">Perempuan
    <br><br>

    <label>Pilihan:</label>
    <select name="pilih">
    <option value="">Pilihanya Apa?</option>
    <option value="1">Pilhan 1</option> 
    <option value="2">Pilhan 2</option>
    <option value="3">Pilhan 3</option>
    <option value="4">Pilhan 4</option>
    <option value="5">Pilhan 5</option>
    </select>
    <br><br>

    <label>Kolom Komentar:</label>
    <textarea name="komentar" rows="10" cols="20"></textarea>
    <br><br>

    <input type="submit" name="proses" value="simpan"> <!-- submit: diekekusi -->
    <input type="reset" name="unproses" value="Batal">  <!-- reset: tidak dieksekusi/di batalkan --> 

</form>
