<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM REGISTRATION</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
    
        .form-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 400px;
        }
    
        h2 {
            text-align: center;
            margin-bottom: 5px;
        }
    
        p {
            text-align: center;
            color: #555;
            margin-top: 0;
            font-size: 14px;
        }
    
        form {
            display: flex;
            flex-direction: column;
        }
    
        .name-group {
            display: flex;
            gap: 10px;
        }
    
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
    
        .checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 15px;
        }
    
        label {
            font-size: 14px;
            color: #333;
        }
    
        .terms {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            margin-bottom: 20px;
        }
    
        button {
            background-color: black;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
    
        button:hover {
            background-color: #333;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Class Registration Form</h2>
        <p>Please fill out the form below to register for our class</p>
    
        <form>
            <div class="name-group">
                <input type="text" placeholder="First Name" required>
                <input type="text" placeholder="Last Name" required>
            </div>
    
            <input type="email" placeholder="Email Address" required>
            <input type="tel" placeholder="Phone Number" required>
    
            <label for="level"><b>Class Level</b></label>
            <select id="level" required>
                <option value="">Select your class level</option>
                <option>Beginner</option>
                <option>Intermediate</option>
                <option>Advanced</option>
            </select>
            <p style="font-size: 12px; color: gray; margin-top: -10px;">
                Please choose the appropriate level for your experience
            </p>
    
            <label><b>Class Days</b></label>
            <p style="font-size: 12px; color: gray; margin-top: -10px;">
                Please select the days you are available to attend class
            </p>
            <div class="checkbox-group">
                <label><input type="checkbox"> Monday</label>
                <label><input type="checkbox"> Tuesday</label>
                <label><input type="checkbox"> Wednesday</label>
                <label><input type="checkbox"> Thursday</label>
                <label><input type="checkbox"> Friday</label>
                <label><input type="checkbox"> Saturday</label>
            </div>
    
            <div class="terms">
                <input type="checkbox" required>
                <label>I agree to the terms and conditions of the class registration</label>
            </div>
    
            <button type="submit">Register Now!</button>
        </form>
    </div>
</body>
</html>
